name: Fresh PR cycle v2 — expanded diagnosis budget
on:
  push:
    branches: [hackathon/fresh-pr-cycle-v2-live-once]
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: fresh-pr-cycle-v2
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e './services/support-agent-python[test]' 'openai>=2,<3'
      - run: python -m pytest -q tests/test_pr_cycle.py tests/test_patcher.py tests/test_diagnosis.py tests/test_expanded_domain.py
      - name: Execute one registered fresh cycle
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python -m wheel.pr_cycle --pr 27 --version v2 --expected "$GITHUB_SHA" --output fresh-cycle-v2-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-pr-cycle-v2-evidence
          path: fresh-cycle-v2-output/
