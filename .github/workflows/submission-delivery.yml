name: Verify submission delivery
on:
  pull_request:
    branches: [master]
    paths: ['delivery/**', 'tests/test_submission_delivery.py', '.github/workflows/submission-delivery.yml', 'README.md']
  push:
    branches: [master]
    paths: ['delivery/**', 'tests/test_submission_delivery.py', '.github/workflows/submission-delivery.yml', 'README.md']
permissions:
  contents: read
  actions: read
jobs:
  recorded-evidence-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e './services/support-agent-python[test]'
      - name: Retrieve fixed evidence archives on trusted host; no new model requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/submission-evidence"
          gh api repos/PrasathJaga/codex-wheel/actions/artifacts/13006180773/zip > "$RUNNER_TEMP/submission-evidence/fresh-pr-cycle-v2.zip"
          gh api repos/PrasathJaga/codex-wheel/actions/artifacts/13003967836/zip > "$RUNNER_TEMP/submission-evidence/fresh-pr-cycle-failure.zip"
          gh api repos/PrasathJaga/codex-wheel/actions/artifacts/13036779161/zip > "$RUNNER_TEMP/submission-evidence/inventory-repair-v1.zip"
          gh api repos/PrasathJaga/codex-wheel/actions/artifacts/13099805978/zip > "$RUNNER_TEMP/submission-evidence/generic-meta-integration-v1-verified.zip"
      - name: Rebuild and reject tampered inputs
        env:
          WHEEL_SUBMISSION_EVIDENCE_DIR: ${{ runner.temp }}/submission-evidence
        run: python -m unittest discover -s tests -p test_submission_delivery.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Desktop/mobile controls and offline report access
        run: node delivery/browser_check.cjs
      - name: Preserve reviewer report and verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: submission-review-report
          path: |
            delivery/index.html
            delivery/evidence.json
            delivery/generic-integration-audit.json
            delivery/browser-verification.json
            delivery/SUBMISSION.md
            delivery/SUBMISSION_COPY.md
            delivery/DEMO_SCRIPT.md
            delivery/ARCHITECTURE.md
            delivery/ONBOARDING_TRIAL.md
