name: Registered generic Meta integration v1
on:
  pull_request:
    branches: [master]
    paths:
      - 'evaluation/generic_paid_integration_v1/**'
      - 'preflight_tests/test_generic_paid_registration.py'
      - '.github/workflows/generic-paid-integration.yml'
      - 'docs/GENERIC_PAID_INTEGRATION_V1.md'
  push:
    branches: [evaluation/generic-meta-integration-v1-once]
permissions:
  contents: read
  actions: read
concurrency:
  group: generic-meta-integration-v1-once
  cancel-in-progress: false
jobs:
  registration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate registration only; no Docker, SDK or keys
        run: python -m unittest discover -s preflight_tests -p test_generic_paid_registration.py -v
  trusted-controller:
    if: github.event_name == 'push' && github.ref == 'refs/heads/evaluation/generic-meta-integration-v1-once' && github.run_attempt == 1
    needs: registration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reject any prior launch before accessing model key
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          url='https://api.github.com/repos/PrasathJaga/codex-wheel/actions/runs?branch=evaluation%2Fgeneric-meta-integration-v1-once&event=push&per_page=100'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'User-Agent':'registered-generic-integration'})
          with urllib.request.urlopen(request,timeout=30) as response: data=json.load(response)
          if data['total_count']>100 or any(str(r['id'])!=os.environ['GITHUB_RUN_ID'] and r['name']=='Registered generic Meta integration v1' for r in data['workflow_runs']):
              raise SystemExit('Prior integration launch exists; no retry or resampling')
          PY
      - name: Acquire only registered immutable public runtime images
        run: |
          python - <<'PY'
          import json,subprocess
          data=json.load(open('evaluation/generic_paid_integration_v1/registration.json'))
          for image in data['images'].values(): subprocess.run(['docker','pull',image],check=True,timeout=180)
          PY
      - name: Install SDK on trusted host only
        run: python -m pip install 'openai>=2,<3'
      - name: Initialize finite integration (no inference)
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python -m evaluation.generic_paid_integration_v1.launch --output "$RUNNER_TEMP/generic-meta-integration" --initialize
      - name: Python preserving control
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python -m evaluation.generic_paid_integration_v1.launch --output "$RUNNER_TEMP/generic-meta-integration" --case-id python_preserving
      - name: Python violating control
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python -m evaluation.generic_paid_integration_v1.launch --output "$RUNNER_TEMP/generic-meta-integration" --case-id python_violating
      - name: Java preserving control
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python -m evaluation.generic_paid_integration_v1.launch --output "$RUNNER_TEMP/generic-meta-integration" --case-id java_preserving
      - name: Java violating control
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python -m evaluation.generic_paid_integration_v1.launch --output "$RUNNER_TEMP/generic-meta-integration" --case-id java_violating
      - name: Preserve all outcomes including stopped attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generic-meta-integration-v1
          path: ${{ runner.temp }}/generic-meta-integration/
          if-no-files-found: warn
          retention-days: 30
