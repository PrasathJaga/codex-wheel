name: G4 bounded Meta runtime
on:
  workflow_dispatch:
  push:
    branches: [hackathon/preflight-freeze-gates]
    paths:
      - 'wheel/**'
      - 'tests/**'
      - '.github/workflows/g4-meta.yml'
permissions:
  contents: read
concurrency:
  group: g4-meta-runtime
  cancel-in-progress: false
jobs:
  live-meta:
    if: github.repository == 'PrasathJaga/codex-wheel'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/refund-api-java/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e './services/support-agent-python[test]' 'openai>=2,<3'
      - name: Offline contracts before spending credits
        run: python -m pytest -q tests services/support-agent-python/tests
      - name: Six-call maximum real Meta experiment
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python -m wheel.experiment --meta
      - name: Record dependency versions
        if: always()
        run: |
          mkdir -p evidence-g4
          python -m pip freeze > evidence-g4/dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-meta-evidence
          path: evidence-g4/
