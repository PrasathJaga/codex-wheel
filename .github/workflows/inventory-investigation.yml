name: Bounded inventory investigation
on:
  pull_request:
    branches: [master]
  push:
    branches: [inventory/bounded-investigation-live-once]
permissions:
  contents: read
concurrency:
  group: inventory-investigation-v1
  cancel-in-progress: false
jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p test_inventory_investigation.py -v
  investigation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/inventory/bounded-investigation-live-once'
    needs: adapter-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e './services/support-agent-python[test]' 'openai>=2,<3'
      - name: Execute one registered source-aware inventory investigation
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python -m wheel.inventory_investigation --expected "$GITHUB_SHA" --output inventory-investigation-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-investigation-v1
          path: inventory-investigation-evidence/
