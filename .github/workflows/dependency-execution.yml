name: Offline dependency consumption controls
on:
  pull_request:
    branches: [master]
    paths:
      - 'preflight/dependency_environment.py'
      - 'preflight/dependency_execution_smoke.py'
      - 'preflight/isolated_executor.py'
      - 'preflight_tests/test_dependency_environment.py'
      - 'docs/DEPENDENCY_EXECUTION_V1.md'
      - '.github/workflows/dependency-execution.yml'
  push:
    branches: [master]
    paths:
      - 'preflight/dependency_environment.py'
      - 'preflight/dependency_execution_smoke.py'
      - 'preflight/isolated_executor.py'
      - 'preflight_tests/test_dependency_environment.py'
      - 'docs/DEPENDENCY_EXECUTION_V1.md'
      - '.github/workflows/dependency-execution.yml'
permissions:
  contents: read
jobs:
  consumption:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s preflight_tests -p test_dependency_environment.py -v
      - name: Acquire trusted control runtime images on host
        run: |
          docker pull python:3.12-slim
          docker pull eclipse-temurin:21-jdk
          docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}' > "$RUNNER_TEMP/python-image.txt"
          docker image inspect eclipse-temurin:21-jdk --format '{{index .RepoDigests 0}}' > "$RUNNER_TEMP/java-image.txt"
      - name: Download fixed reviewed bytes; execute dependency code only inside offline containers
        run: |
          python -m preflight.dependency_execution_smoke \
            --python-image "$(cat "$RUNNER_TEMP/python-image.txt")" \
            --java-image "$(cat "$RUNNER_TEMP/java-image.txt")" \
            --output "$RUNNER_TEMP/dependency-consumption"
      - name: Replay original offline executor controls
        run: |
          python -m preflight.executor_smoke \
            --python-image "$(cat "$RUNNER_TEMP/python-image.txt")" \
            --java-image "$(cat "$RUNNER_TEMP/java-image.txt")" \
            --output "$RUNNER_TEMP/dependency-consumption/offline-regression"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-dependency-consumption
          path: ${{ runner.temp }}/dependency-consumption/
          if-no-files-found: warn
