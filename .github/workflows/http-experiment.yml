name: Generic bounded HTTP experiments
on:
  pull_request:
    branches: [master]
    paths:
      - 'preflight/http_experiment*.py'
      - 'preflight/service_executor.py'
      - 'preflight_tests/test_http_experiment.py'
      - '.github/workflows/http-experiment.yml'
      - 'docs/HTTP_EXPERIMENT_V1.md'
  push:
    branches: [master]
    paths:
      - 'preflight/http_experiment*.py'
      - 'preflight/service_executor.py'
      - 'preflight_tests/test_http_experiment.py'
      - '.github/workflows/http-experiment.yml'
      - 'docs/HTTP_EXPERIMENT_V1.md'
permissions:
  contents: read
jobs:
  http-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Strict interface and independent verifier checks; no inference
        run: python -m unittest discover -s preflight_tests -p test_http_experiment.py -v
      - name: Acquire control images on trusted host only
        run: |
          docker pull python:3.12-slim
          docker pull eclipse-temurin:21-jdk
          docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}' > "$RUNNER_TEMP/http-python-image.txt"
          docker image inspect eclipse-temurin:21-jdk --format '{{index .RepoDigests 0}}' > "$RUNNER_TEMP/http-java-image.txt"
      - name: Execute frozen HTTP controls against Java and Python
        run: |
          python -m preflight.http_experiment_smoke \
            --python-image "$(cat "$RUNNER_TEMP/http-python-image.txt")" \
            --java-image "$(cat "$RUNNER_TEMP/http-java-image.txt")" \
            --output "$RUNNER_TEMP/http-controls"
      - name: Preserve all outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generic-http-controls
          path: ${{ runner.temp }}/http-controls/
          if-no-files-found: warn
