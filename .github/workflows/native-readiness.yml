name: Native dependency readiness analysis (not native builds)
on:
  pull_request:
    branches: [master]
    paths:
      - 'evaluation/native_readiness_v1/**'
      - 'preflight_tests/test_native_readiness.py'
      - 'docs/NATIVE_ENVIRONMENT_READINESS_V1.md'
      - '.github/workflows/native-readiness.yml'
  push:
    branches: [master]
    paths:
      - 'evaluation/native_readiness_v1/**'
      - 'preflight_tests/test_native_readiness.py'
      - 'docs/NATIVE_ENVIRONMENT_READINESS_V1.md'
      - '.github/workflows/native-readiness.yml'
permissions:
  contents: read
jobs:
  evidence-analysis-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Readiness analysis checks only; no project code, package installation or paid requests
        run: python -m unittest discover -s preflight_tests -p test_native_readiness.py -v
