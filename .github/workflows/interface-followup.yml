name: Registered interface follow-up v2
on:
  workflow_dispatch:
  push:
    branches: [hackathon/interface-followup-live]
    paths: ['wheel/**', 'evaluation/interface_followup_v2.json', '.github/workflows/interface-followup.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: interface-followup-v2
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.repository == 'PrasathJaga/codex-wheel'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/refund-api-java/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e './services/support-agent-python[test]' 'openai>=2,<3'
      - name: Offline validation
        env:
          WHEEL_REQUIRE_BROKER_TEST: '1'
        run: python -m pytest -q tests services/support-agent-python/tests
      - name: Download preserved v1 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/PrasathJaga/codex-wheel/actions/artifacts/12963453214/zip > "$RUNNER_TEMP/prior.zip"
      - name: Run both registered arms once
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          EXPECTED_IMPLEMENTATION_COMMIT: ${{ github.sha }}
        run: python -m wheel.interface_followup --expected-implementation-commit "$EXPECTED_IMPLEMENTATION_COMMIT" --prior "$RUNNER_TEMP/prior.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-followup-v2-evidence
          path: evidence-interface-v2/
          retention-days: 90
