name: External repository isolated preflight
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/external-preflight.yml'
      - 'evaluation/external_preflight_v1.json'
      - 'preflight_tests/test_external_preflight_policy.py'
      - 'docs/EXTERNAL_REPOSITORY_PREFLIGHT.md'
      - 'preflight/**'
      - 'preflight_tests/**'
      - 'evaluation/petclinic_contract_v1.json'
      - 'evaluation/petclinic_adapter*'
      - 'evaluation/petclinic_healthy_plans_v1.json'
      - 'docs/PETCLINIC_ADAPTER.md'
      - 'docs/PETCLINIC_CONTRACT.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s preflight_tests -v
  external-baseline:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    env:
      UPSTREAM_REVISION: e1987d2b4715b30f8b97050b3a399fdcadf92cb3
    steps:
      - name: Acquire public input without checking out Wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-input" "$RUNNER_TEMP/preflight-evidence"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            "https://codeload.github.com/spring-petclinic/spring-petclinic-rest/tar.gz/$UPSTREAM_REVISION" \
            --output "$RUNNER_TEMP/public-input/source.tar.gz"
          sha256sum "$RUNNER_TEMP/public-input/source.tar.gz" > "$RUNNER_TEMP/preflight-evidence/source.sha256"
          printf '%s\n' "$UPSTREAM_REVISION" > "$RUNNER_TEMP/preflight-evidence/upstream-revision.txt"
          docker pull maven:3.9.9-eclipse-temurin-17
          docker pull python:3.13-slim
          docker pull postgres:17-bookworm
          docker image inspect postgres:17-bookworm --format '{{index .RepoDigests 0}}' > "$RUNNER_TEMP/preflight-evidence/postgres-image.txt"
          docker image inspect maven:3.9.9-eclipse-temurin-17 --format '{{index .RepoDigests 0}}' > "$RUNNER_TEMP/preflight-evidence/build-image.txt"
          docker image inspect python:3.13-slim --format '{{index .RepoDigests 0}}' > "$RUNNER_TEMP/preflight-evidence/probe-image.txt"
      - name: Build unchanged upstream only inside restricted container
        shell: bash
        run: |
          set -euo pipefail
          build_image="$(cat "$RUNNER_TEMP/preflight-evidence/build-image.txt")"
          work_volume="petclinic-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$work_volume"
          # Trusted image initialization only; no upstream bytes mounted here.
          docker run --rm --entrypoint chown --network none --read-only --cap-drop ALL --cap-add CHOWN \
            --security-opt no-new-privileges --mount "type=volume,src=$work_volume,dst=/work" \
            "$build_image" 1000:1000 /work
          set +e
          docker run --name "petclinic-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --entrypoint /bin/sh --user 1000:1000 --read-only --cap-drop ALL --security-opt no-new-privileges \
            --cpus 2 --memory 3g --pids-limit 256 --network bridge \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g,uid=1000,gid=1000 \
            --mount "type=bind,src=$RUNNER_TEMP/public-input/source.tar.gz,dst=/input/source.tar.gz,readonly" \
            --mount "type=volume,src=$work_volume,dst=/work" \
            "$build_image" -eu -c '
              tar -xzf /input/source.tar.gz -C /work --strip-components=1
              cd /work
              java -version
              mvn -version
              mvn -B -ntp -Dmaven.repo.local=/tmp/m2 verify
            ' > "$RUNNER_TEMP/preflight-evidence/build.log" 2>&1
          build_status=$?
          set -e
          printf '%s\n' "$build_status" > "$RUNNER_TEMP/preflight-evidence/build-exit.txt"
          docker inspect "petclinic-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --format '{{json .State}}' > "$RUNNER_TEMP/preflight-evidence/build-state.json"
          exit "$build_status"
      - name: Verify fresh startup and reset twice without outbound networking
        shell: bash
        run: |
          set -euo pipefail
          build_image="$(cat "$RUNNER_TEMP/preflight-evidence/build-image.txt")"
          probe_image="$(cat "$RUNNER_TEMP/preflight-evidence/probe-image.txt")"
          work_volume="petclinic-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for trial in 1 2; do
            service_name="petclinic-service-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$trial"
            docker run -d --name "$service_name" --entrypoint java --user 1000:1000 --read-only \
              --cap-drop ALL --security-opt no-new-privileges --network none \
              --cpus 2 --memory 2g --pids-limit 256 \
              --tmpfs /tmp:rw,nosuid,nodev,size=256m,uid=1000,gid=1000 \
              --mount "type=volume,src=$work_volume,dst=/work,readonly" \
              "$build_image" -jar /work/target/spring-petclinic-rest-4.0.2.jar
            docker inspect "$service_name" --format '{{json .HostConfig}}' \
              > "$RUNNER_TEMP/preflight-evidence/runtime-config-$trial.json"
            set +e
            docker run --rm -i --user 1000:1000 --read-only --cap-drop ALL \
              --security-opt no-new-privileges --memory 128m --pids-limit 32 \
              --network "container:$service_name" "$probe_image" python - > \
              "$RUNNER_TEMP/preflight-evidence/probe-$trial.json" 2> \
              "$RUNNER_TEMP/preflight-evidence/probe-$trial.log" <<'PY'
          import json, time, urllib.request
          base = "http://127.0.0.1:9966/petclinic"
          for attempt in range(120):
              try:
                  with urllib.request.urlopen(base + "/actuator/health", timeout=2) as response:
                      health = json.load(response)
                  if health.get("status") == "UP":
                      break
              except (OSError, ValueError):
                  pass
              time.sleep(1)
          else:
              raise SystemExit("Startup health timeout")
          with urllib.request.urlopen(base + "/api/owners", timeout=10) as response:
              owners = json.load(response)
          if not isinstance(owners, list) or not owners:
              raise SystemExit("Expected seeded owners list")
          print(json.dumps({"health": health, "owners": owners}, sort_keys=True))
          PY
            probe_status=$?
            set -e
            docker logs "$service_name" > "$RUNNER_TEMP/preflight-evidence/service-$trial.log" 2>&1
            docker stop --time 10 "$service_name"
            printf '%s\n' "$probe_status" > "$RUNNER_TEMP/preflight-evidence/probe-exit-$trial.txt"
            if [ "$probe_status" -ne 0 ]; then exit "$probe_status"; fi
          done
          cmp "$RUNNER_TEMP/preflight-evidence/probe-1.json" "$RUNNER_TEMP/preflight-evidence/probe-2.json"
          printf '%s\n' 'build-and-startup-only; independent business-contract verification pending' \
            > "$RUNNER_TEMP/preflight-evidence/scope.txt"
      - name: Independent committed-state contract checks
        shell: bash
        run: |
          python - <<'PY_CONTRACT'
          """Bounded profile-update experiment interface; trusted host code only."""
          import copy
          from datetime import date
          import hashlib
          import json
          import re
          
          PROTOCOL = "petclinic-profile-v1"
          MAX_ACTIONS = 8
          EDIT_PATHS = frozenset({
              "src/main/java/org/springframework/samples/petclinic/rest/controller/v1/PetRestControllerV1.java",
              "src/main/java/org/springframework/samples/petclinic/mapper/PetMapper.java",
              "src/main/java/org/springframework/samples/petclinic/model/Pet.java",
              "src/main/java/org/springframework/samples/petclinic/service/ClinicServiceImpl.java",
          })
          
          
          class AdmissionError(ValueError):
              pass
          
          
          class ExperimentViolation(ValueError):
              pass
          
          
          def canonical(value):
              return json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode()
          
          
          def digest(value):
              return hashlib.sha256(canonical(value)).hexdigest()
          
          
          def exact(value, keys):
              if type(value) is not dict or set(value) != set(keys):
                  raise AdmissionError("Unknown or missing fields")
          
          
          def validate_plan(plan):
              exact(plan, {"protocol", "actions"})
              if plan["protocol"] != PROTOCOL:
                  raise AdmissionError("Unsupported protocol")
              actions = plan["actions"]
              if type(actions) is not list or not 1 <= len(actions) <= MAX_ACTIONS:
                  raise AdmissionError("Action budget exceeded or empty")
              meaningful = False
              for action in actions:
                  if type(action) is not dict:
                      raise AdmissionError("Action must be an object")
                  op = action.get("op")
                  if op == "READ_PET":
                      exact(action, {"op", "pet"})
                  elif op == "UPDATE_PET_PROFILE":
                      exact(action, {"op", "pet", "name", "birth_date", "type"})
                      if type(action["name"]) is not str or not re.fullmatch(r"[A-Za-z0-9 ]{0,30}", action["name"]):
                          raise AdmissionError("Name outside declared input domain")
                      if type(action["birth_date"]) is not str:
                          raise AdmissionError("Birth date must be ISO text")
                      try:
                          birth = date.fromisoformat(action["birth_date"])
                      except ValueError as error:
                          raise AdmissionError("Invalid birth date") from error
                      if birth.isoformat() != action["birth_date"] or not date(2000, 1, 1) <= birth <= date(2025, 12, 31):
                          raise AdmissionError("Date outside frozen input domain")
                      if action["type"] not in ("original_type", "alternate_type"):
                          raise AdmissionError("Unsupported type reference")
                      if action["pet"] not in ("visited_pet", "missing_pet"):
                          raise AdmissionError("Only declared target can be edited")
                      meaningful |= action["pet"] == "visited_pet" and bool(action["name"])
                  else:
                      raise AdmissionError("Unsupported action")
                  if action["pet"] not in ("visited_pet", "unrelated_pet", "missing_pet"):
                      raise AdmissionError("Unsupported pet reference")
              if not meaningful:
                  raise AdmissionError("Plan has no valid target-update experiment")
              return copy.deepcopy(plan)
          
          
          def freeze_plan(plan):
              validated = validate_plan(plan)
              return {"plan": validated, "sha256": digest(validated)}
          
          
          def authenticate_plan(frozen, expected_sha256):
              exact(frozen, {"plan", "sha256"})
              plan = validate_plan(frozen["plan"])
              if type(expected_sha256) is not str or not re.fullmatch(r"[0-9a-f]{64}", expected_sha256):
                  raise AdmissionError("Missing trusted plan digest")
              if type(frozen["sha256"]) is not str or digest(plan) != frozen["sha256"] or frozen["sha256"] != expected_sha256:
                  raise AdmissionError("Frozen plan changed")
              return plan
          
          
          def admit_pair(baseline, candidate):
              """Compare COMPLETE trusted path/content-hash maps; no model-provided maps."""
              for tree in (baseline, candidate):
                  if type(tree) is not dict or not tree:
                      raise AdmissionError("Complete nonempty source maps required")
                  for path, value in tree.items():
                      if type(path) is not str or path.startswith("/") or ".." in path.split("/") or "\\" in path:
                          raise AdmissionError("Unsafe source path")
                      if type(value) is not str or not re.fullmatch(r"[0-9a-f]{64}", value):
                          raise AdmissionError("Expected SHA-256 source identity")
              if baseline.keys() != candidate.keys():
                  raise AdmissionError("File additions/deletions are unsupported")
              changed = sorted(p for p in baseline if baseline[p] != candidate[p])
              if not set(changed) <= EDIT_PATHS:
                  raise AdmissionError("Unsupported changed path")
              return {"baseline_map_sha256": digest(baseline), "candidate_map_sha256": digest(candidate),
                      "changed_paths": changed, "unchanged_control": not changed}
          
          
          def execute_plan(frozen, initial, request_fn, snapshot_fn, events, *, expected_sha256):
              """URLs and expected effects derive from validated actions, never model prose."""
              plan = authenticate_plan(frozen, expected_sha256)
              visited_ids = {v["pet_id"] for v in initial["visits"]}
              target = next((p for p in initial["pets"] if p["id"] in visited_ids), None)
              if target is None:
                  raise AdmissionError("Seed lacks visited target")
              unrelated = next((p for p in initial["pets"] if p["id"] != target["id"]), None)
              alternate = next((t for t in initial["types"] if t["id"] != target["type_id"]), None)
              original = next((t for t in initial["types"] if t["id"] == target["type_id"]), None)
              if unrelated is None or alternate is None or original is None:
                  raise AdmissionError("Seed lacks required controls")
              if any(p["id"] == 2147483647 for p in initial["pets"]):
                  raise AdmissionError("Missing-target sentinel exists")
              ids = {"visited_pet": target["id"], "unrelated_pet": unrelated["id"], "missing_pet": 2147483647}
              kinds = {"original_type": original, "alternate_type": alternate}
              expected = copy.deepcopy(initial)
              changed = False
              for action in plan["actions"]:
                  pet_id = ids[action["pet"]]
                  path = "/api/pets/" + str(pet_id)
                  body = None
                  if action["op"] == "READ_PET":
                      method, expected_status = "GET", 404 if action["pet"] == "missing_pet" else 200
                  else:
                      method = "PUT"
                      body = {"name": action["name"], "birthDate": action["birth_date"], "type": kinds[action["type"]]}
                      expected_status = 400 if not action["name"] else 404 if action["pet"] == "missing_pet" else 204
                      if expected_status == 204:
                          row = next(p for p in expected["pets"] if p["id"] == pet_id)
                          fields = {"name": action["name"], "birth_date": action["birth_date"], "type_id": kinds[action["type"]]["id"]}
                          changed |= any(row[k] != v for k, v in fields.items())
                          row.update(fields)
                  status, response = request_fn(method, path, body)
                  event = {"action": copy.deepcopy(action), "method": method, "path": path,
                           "body": body, "status": status, "response": response}
                  events.append(event)
                  state = snapshot_fn()
                  event["committed_state"] = state
                  if status != expected_status:
                      raise ExperimentViolation("Unexpected HTTP outcome at action " + str(len(events)))
                  if state != expected:
                      raise ExperimentViolation("Committed effects violate contract at action " + str(len(events)))
              if not changed:
                  raise AdmissionError("Selected input produces no non-vacuous profile change")
              return {"verdict": "healthy_contract_observed", "plan_sha256": frozen["sha256"],
                      "actions": len(events), "pet_id": target["id"], "final_state": expected}
          
          __WHEEL_EMBEDDED_ADAPTER__ = True
          PUBLIC_HEALTHY_PLANS = [{'plan': {'protocol': 'petclinic-profile-v1', 'actions': [{'op': 'READ_PET', 'pet': 'visited_pet'}, {'op': 'UPDATE_PET_PROFILE', 'pet': 'visited_pet', 'name': '', 'birth_date': '2020-01-02', 'type': 'alternate_type'}, {'op': 'UPDATE_PET_PROFILE', 'pet': 'missing_pet', 'name': 'WheelProbe', 'birth_date': '2020-01-02', 'type': 'alternate_type'}, {'op': 'UPDATE_PET_PROFILE', 'pet': 'visited_pet', 'name': 'WheelProbe', 'birth_date': '2020-01-02', 'type': 'alternate_type'}, {'op': 'READ_PET', 'pet': 'unrelated_pet'}]}, 'sha256': '2002f25be48cd97998ca2c650136769f6d80b2c2725171a892f3012937c41895'}, {'plan': {'protocol': 'petclinic-profile-v1', 'actions': [{'op': 'UPDATE_PET_PROFILE', 'pet': 'visited_pet', 'name': 'WheelRepeat', 'birth_date': '2020-01-02', 'type': 'alternate_type'}, {'op': 'UPDATE_PET_PROFILE', 'pet': 'visited_pet', 'name': 'WheelRepeat', 'birth_date': '2020-01-02', 'type': 'alternate_type'}, {'op': 'READ_PET', 'pet': 'visited_pet'}, {'op': 'UPDATE_PET_PROFILE', 'pet': 'visited_pet', 'name': 'WheelFinal', 'birth_date': '2020-01-02', 'type': 'original_type'}, {'op': 'READ_PET', 'pet': 'missing_pet'}]}, 'sha256': '1b250d4f7b53f63fb803ed9d614a6521d5f2385b406dfede1ed22308ca76214d'}]
          PUBLIC_PLAN_HASHES = ['2002f25be48cd97998ca2c650136769f6d80b2c2725171a892f3012937c41895', '1b250d4f7b53f63fb803ed9d614a6521d5f2385b406dfede1ed22308ca76214d']
          """Trusted host check; never mount this module or Wheel into the service."""
          import copy
          import hashlib
          import json
          import ipaddress
          import os
          from pathlib import Path
          from secrets import token_hex
          import subprocess
          import time
          import urllib.error
          import urllib.request
          
          
          if "__WHEEL_EMBEDDED_ADAPTER__" not in globals():
              from preflight.petclinic_adapter import authenticate_plan, execute_plan, ExperimentViolation
          
          
          class ContractFailure(ValueError):
              pass
          
          
          def verify_update(before, after, pet_id, expected):
              """Require exact row preservation except three explicitly editable columns."""
              if set(before) != {"owners", "pets", "visits", "types"} or set(after) != set(before):
                  raise ContractFailure("Incomplete evidence tables")
              for table in before:
                  rows = before[table]
                  if not isinstance(rows, list) or not isinstance(after[table], list):
                      raise ContractFailure("Unknown rows are not empty rows")
                  for values in (rows, after[table]):
                      ids = [r["id"] for r in values]
                      if len(ids) != len(set(ids)):
                          raise ContractFailure("Duplicate evidence identities")
              if not before["owners"] or not before["visits"]:
                  raise ContractFailure("Missing non-vacuous owner/visit controls")
              targets = [p for p in before["pets"] if p["id"] == pet_id]
              if len(targets) != 1 or not any(v["pet_id"] == pet_id for v in before["visits"]):
                  raise ContractFailure("Target must have existing visit history")
              if len(before["pets"]) < 2:
                  raise ContractFailure("Missing unrelated pet control")
              if set(expected) != {"name", "birth_date", "type_id"}:
                  raise ContractFailure("Unapproved edited columns")
              wanted = copy.deepcopy(before)
              target = next(p for p in wanted["pets"] if p["id"] == pet_id)
              if all(target[k] == v for k, v in expected.items()):
                  raise ContractFailure("Vacuous update")
              target.update(expected)
              if after != wanted:
                  raise ContractFailure("Committed state violates profile-update preservation")
              return {"verdict": "healthy_contract_observed", "pet_id": pet_id,
                      "preserved_visits": len(before["visits"]), "preserved_owners": len(before["owners"])}
          
          
          def command(args, *, data=None, env=None, check=True):
              return subprocess.run(args, input=data, text=True, capture_output=True,
                                    env=env, check=check, timeout=180)
          
          
          def sql(database, statement, role="postgres", check=True):
              return command(["docker", "exec", "-i", database, "psql", "-X", "-qAt",
                              "-v", "ON_ERROR_STOP=1", "-U", role, "-d", "petclinic"],
                             data=statement, check=check)
          
          
          def snapshot(database):
              # One consistent committed-state snapshot, using SELECT privileges only.
              parts = []
              for table in ("owners", "pets", "visits", "types"):
                  parts.append("'%s', (SELECT coalesce(json_agg(t ORDER BY id), '[]'::json) "
                               "FROM (SELECT * FROM %s) t)" % (table, table))
              query = "BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY; SELECT json_build_object(" + ",".join(parts) + "); COMMIT;"
              return json.loads(sql(database, query, role="wheel_verify").stdout)
          
          
          def request(method, path, body=None, *, base_url, timeout=10):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(base_url + path,
                                           data=data, method=method,
                                           headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.build_opener(urllib.request.ProxyHandler({})).open(req, timeout=timeout) as response:
                      return response.status, response.read().decode()
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode()
          
          
          def main():
              evidence = Path(os.environ["RUNNER_TEMP"]) / "preflight-evidence"
              image = (evidence / "build-image.txt").read_text().strip()
              pg_image = (evidence / "postgres-image.txt").read_text().strip()
              suffix = os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
              volume = "petclinic-preflight-" + suffix
              if "PUBLIC_HEALTHY_PLANS" in globals():
                  healthy_plans = PUBLIC_HEALTHY_PLANS
                  expected_hashes = PUBLIC_PLAN_HASHES
              else:
                  root = Path(__file__).resolve().parents[1]
                  healthy_plans = json.loads((root / "evaluation/petclinic_healthy_plans_v1.json").read_text())
                  lock = json.loads((root / "evaluation/petclinic_adapter_lock_v1.json").read_text())
                  expected_hashes = lock["public_plan_sha256"]
              if len(healthy_plans) != 2 or len(expected_hashes) != 2:
                  raise ValueError("Expected exactly two public healthy adapter controls")
              for frozen, expected_hash in zip(healthy_plans, expected_hashes):
                  authenticate_plan(frozen, expected_hash)
              (evidence / "plan-admission.json").write_text(json.dumps({"accepted_plan_sha256": expected_hashes}))
              outcomes = []
              for trial, (frozen, plan_hash) in enumerate(zip(healthy_plans, expected_hashes), 1):
                  network = "petclinic-contract-" + suffix + "-" + str(trial)
                  database, service = network + "-db", network + "-api"
                  folder = evidence / ("contract-" + str(trial))
                  folder.mkdir()
                  record = {"scope": "healthy-profile-update-only", "trial": trial,
                            "status": "execution_error", "requests": []}
                  try:
                      command(["docker", "network", "create", "--internal", network])
                      admin_password, app_password = token_hex(24), token_hex(24)
                      db_env = {**os.environ, "POSTGRES_PASSWORD": admin_password}
                      command(["docker", "run", "-d", "--name", database, "--network", network,
                               "--network-alias", "database", "--user", "999:999", "--read-only",
                               "--cap-drop", "ALL", "--security-opt", "no-new-privileges",
                               "--memory", "512m", "--pids-limit", "128",
                               "--tmpfs", "/var/lib/postgresql/data:rw,uid=999,gid=999,size=512m",
                               "--tmpfs", "/var/run/postgresql:rw,uid=999,gid=999,size=16m",
                               "--tmpfs", "/tmp:rw,uid=999,gid=999,size=16m",
                               "--env", "POSTGRES_PASSWORD", "--env", "POSTGRES_DB=petclinic", pg_image], env=db_env)
                      for attempt in range(60):
                          ready = command(["docker", "exec", database, "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "petclinic"], check=False)
                          if ready.returncode == 0:
                              break
                          time.sleep(1)
                      else:
                          raise RuntimeError("PostgreSQL readiness timeout")
                      # Temporary application role can initialize its own disposable schema;
                      # it does not know the admin password or verifier role credentials.
                      sql(database, "CREATE ROLE petclinic LOGIN PASSWORD '" + app_password + "';"
                          "GRANT ALL ON SCHEMA public TO petclinic;"
                          "CREATE ROLE wheel_verify LOGIN;"
                          "ALTER ROLE wheel_verify SET default_transaction_read_only=on;")
                      service_env = {**os.environ, "POSTGRES_PASS": app_password}
                      command(["docker", "run", "-d", "--name", service, "--network", network,
                               "--entrypoint", "java",
                               "--user", "1000:1000", "--read-only", "--cap-drop", "ALL",
                               "--security-opt", "no-new-privileges", "--memory", "2g", "--pids-limit", "256",
                               "--tmpfs", "/tmp:rw,uid=1000,gid=1000,size=256m",
                               "--mount", "type=volume,src=" + volume + ",dst=/work,readonly",
                               "--env", "SPRING_PROFILES_ACTIVE=postgres,spring-data-jpa",
                               "--env", "POSTGRES_URL=jdbc:postgresql://database:5432/petclinic",
                               "--env", "POSTGRES_USER=petclinic", "--env", "POSTGRES_PASS",
                               image, "-jar", "/work/target/spring-petclinic-rest-4.0.2.jar"], env=service_env)
                      info = json.loads(command(["docker", "inspect", service]).stdout)[0]
                      address = info["NetworkSettings"]["Networks"][network]["IPAddress"]
                      if not ipaddress.ip_address(address).is_private:
                          raise RuntimeError("Unexpected non-private container address")
                      api_base = "http://" + address + ":9966/petclinic"
                      (folder / "runtime-config.json").write_text(json.dumps(info["HostConfig"], sort_keys=True))
                      deadline = time.monotonic() + 120
                      while time.monotonic() < deadline:
                          try:
                              status, body = request("GET", "/actuator/health", base_url=api_base, timeout=2)
                              record["readiness"] = {"last_status": status, "last_response": body}
                              if status == 200 and json.loads(body).get("status") == "UP":
                                  break
                          except (OSError, ValueError):
                              pass
                          time.sleep(1)
                      else:
                          raise RuntimeError("PetClinic PostgreSQL readiness timeout")
                      sql(database, "GRANT USAGE ON SCHEMA public TO wheel_verify;"
                          "GRANT SELECT ON ALL TABLES IN SCHEMA public TO wheel_verify;")
                      role = sql(database, "SELECT current_user; SHOW default_transaction_read_only;", role="wheel_verify").stdout.splitlines()
                      if role != ["wheel_verify", "on"]:
                          raise RuntimeError("Verifier identity/read-only configuration mismatch")
                      denied = sql(database, "DELETE FROM pets WHERE false;", role="wheel_verify", check=False)
                      if denied.returncode == 0 or "read-only" not in denied.stderr:
                          raise RuntimeError("Verifier write restriction was not enforced")
                      (folder / "verifier-access.json").write_text(json.dumps({"role": role[0], "read_only": True, "write_rejected": True}))
                      before = snapshot(database)
                      (folder / "before.json").write_text(json.dumps(before, sort_keys=True))
                      record["frozen_plan"] = frozen
                      plan_result = execute_plan(
                          frozen, before,
                          lambda method, path, body: request(method, path, body, base_url=api_base),
                          lambda: snapshot(database), record["requests"], expected_sha256=plan_hash)
                      record["plan_sha256"] = plan_result["plan_sha256"]
                      target_id = plan_result["pet_id"]
                      desired = next(p for p in plan_result["final_state"]["pets"] if p["id"] == target_id)
                      expected = {k: desired[k] for k in ("name", "birth_date", "type_id")}
                      command(["docker", "stop", "--timeout", "10", service])
                      stopped = snapshot(database)
                      record["contract"] = verify_update(before, stopped, target_id, expected)
                      (folder / "after-service-stop.json").write_text(json.dumps(stopped, sort_keys=True))
                      record["status"] = "healthy_contract_observed"
                      record["seed_sha256"] = hashlib.sha256(json.dumps(before, sort_keys=True).encode()).hexdigest()
                      outcomes.append(record["seed_sha256"])
                  except (ContractFailure, ExperimentViolation) as error:
                      record["status"], record["error"] = "baseline_contract_failure", str(error)
                      raise
                  except Exception as error:
                      record["error"] = type(error).__name__ + ": " + str(error)
                      raise
                  finally:
                      (folder / "result.json").write_text(json.dumps(record, indent=2, sort_keys=True))
                      for name, label in ((service, "service"), (database, "database")):
                          logs = command(["docker", "logs", name], check=False)
                          (folder / (label + ".log")).write_text(logs.stdout + logs.stderr)
                          command(["docker", "rm", "-f", name], check=False)
                      command(["docker", "network", "rm", network], check=False)
              if len(set(outcomes)) != 1:
                  raise ContractFailure("Fresh database seeds differed")
              (evidence / "contract-summary.json").write_text(json.dumps({
                  "status": "healthy_contract_observed", "trials": 2,
                  "independent_sql_verifier": True, "paid_calls": 0,
                  "scope": "two-public-bounded-plans; no candidate or repair"}, indent=2))
          
          
          if __name__ == "__main__":
              main()
          PY_CONTRACT
      - name: Stop and remove only this run's disposable resources
        if: always()
        shell: bash
        run: |
          for name in "petclinic-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "petclinic-service-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-1" \
            "petclinic-service-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-2"; do
            docker rm -f "$name" >/dev/null 2>&1 || true
          done
          docker volume rm "petclinic-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null 2>&1 || true
      - name: Preserve preflight evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-petclinic-preflight
          path: ${{ runner.temp }}/preflight-evidence/
          if-no-files-found: error
          retention-days: 14

