name: Bounded M1 repair evidence link
on:
  push:
    branches: [hackathon/repair-link-live-once]
permissions:
  contents: read
  actions: read
jobs:
  repair-link:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e './services/support-agent-python[test]' 'openai>=2,<3'
      - run: python -m pytest -q tests/test_repair_link.py tests/test_patcher.py tests/test_report_visualizer.py
      - name: Download pinned evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/PrasathJaga/codex-wheel/actions/artifacts/12958372454/zip > "$RUNNER_TEMP/origin.zip"
          gh api repos/PrasathJaga/codex-wheel/actions/artifacts/12968704899/zip > "$RUNNER_TEMP/repair.zip"
          gh api repos/PrasathJaga/codex-wheel/actions/artifacts/12997661803/zip > "$RUNNER_TEMP/pr.zip"
      - name: One fresh bounded proposal and fresh Java tests
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python -m wheel.repair_link --origin "$RUNNER_TEMP/origin.zip" --repair "$RUNNER_TEMP/repair.zip" --pr-evidence "$RUNNER_TEMP/pr.zip" --output repair-link-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-repair-link
          path: repair-link-output/
