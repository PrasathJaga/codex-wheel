name: Bounded inventory repair
on:
  pull_request:
    branches: [master]
  push:
    branches: [inventory/bounded-repair-live-once]
permissions:
  contents: read
  actions: read
concurrency:
  group: inventory-repair-v1
  cancel-in-progress: false
jobs:
  repair-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p test_inventory_repair.py -v
  repair:
    if: github.event_name == 'push' && github.ref == 'refs/heads/inventory/bounded-repair-live-once'
    needs: repair-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e './services/support-agent-python[test]' 'openai>=2,<3'
      - name: Download the exact original investigation ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/PrasathJaga/codex-wheel/actions/artifacts/13035465732/zip > inventory-origin.zip
      - name: Execute one bounded repair attempt
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python -m wheel.inventory_repair --expected "$GITHUB_SHA" --origin inventory-origin.zip --output inventory-repair-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-repair-v1
          path: inventory-repair-evidence/
