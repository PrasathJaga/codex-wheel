name: G7 frozen C0 C2 C4 comparison
on:
  workflow_dispatch:
  push:
    branches: [hackathon/g7-comparison-live]
    paths:
      - 'wheel/**'
      - 'tests/**'
      - '.github/workflows/g7-comparison.yml'
permissions:
  contents: read
concurrency:
  group: g7-comparison
  cancel-in-progress: false
jobs:
  comparison:
    if: github.repository == 'PrasathJaga/codex-wheel'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/refund-api-java/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e './services/support-agent-python[test]' 'openai>=2,<3'
      - name: Offline validation
        env:
          WHEEL_REQUIRE_BROKER_TEST: '1'
        run: python -m pytest -q tests services/support-agent-python/tests
      - name: Run frozen comparison
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          EXPECTED_IMPLEMENTATION_COMMIT: ${{ github.sha }}
        run: python -m wheel.evaluation --expected-implementation-commit "$EXPECTED_IMPLEMENTATION_COMMIT"
      - name: Record dependencies
        if: always()
        run: |
          mkdir -p evidence-comparison
          python -m pip freeze > evidence-comparison/dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-comparison-evidence
          path: evidence-comparison/
          retention-days: 90
