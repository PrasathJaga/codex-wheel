name: Generic transfer comparison admission
on:
  pull_request:
    branches: [master]
    paths:
      - 'evaluation/generic_transfer_v1/**'
      - 'preflight_tests/test_generic_transfer.py'
      - 'docs/GENERIC_TRANSFER_EVALUATION_V1.md'
      - '.github/workflows/generic-transfer.yml'
  push:
    branches: [master]
    paths:
      - 'evaluation/generic_transfer_v1/**'
      - 'preflight_tests/test_generic_transfer.py'
      - 'docs/GENERIC_TRANSFER_EVALUATION_V1.md'
      - '.github/workflows/generic-transfer.yml'
permissions:
  contents: read
jobs:
  admission-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze, context parity and provenance gates; no source execution or paid calls
        run: python -m unittest discover -s preflight_tests -p test_generic_transfer.py -v
