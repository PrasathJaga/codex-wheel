name: PetClinic registered internal transfer pilot
on:
  pull_request:
    branches: [master]
  push:
    branches: [evaluation/petclinic-pilot-live-once]
permissions:
  contents: read
  actions: read
concurrency:
  group: petclinic-transfer-pilot-v2-once
  cancel-in-progress: false
jobs:
  pilot-registration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install PyYAML==6.0.3
      - name: Acquire public source for registration reproducibility only
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 --max-filesize 33554432 \
            https://codeload.github.com/spring-petclinic/spring-petclinic-rest/tar.gz/e1987d2b4715b30f8b97050b3a399fdcadf92cb3 \
            --output "$RUNNER_TEMP/pilot-upstream.tar.gz"
      - name: Validate registrations and all existing guards without execution
        env:
          WHEEL_PILOT_ARCHIVE: ${{ runner.temp }}/pilot-upstream.tar.gz
        run: python -m unittest discover -s preflight_tests -v
      - run: python -m preflight.petclinic_meta_runner
  trusted-pilot-controller:
    if: github.event_name == 'push' && github.ref == 'refs/heads/evaluation/petclinic-pilot-live-once' && github.run_attempt == 1
    needs: pilot-registration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reject a previously launched live branch
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = 'https://api.github.com/repos/PrasathJaga/codex-wheel/actions/runs?branch=evaluation%2Fpetclinic-pilot-live-once&event=push&per_page=100'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'], 'User-Agent': 'registered-petclinic-pilot'})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)
          if data['total_count'] > 100 or any(str(r['id']) != os.environ['GITHUB_RUN_ID'] and r['name'] == 'PetClinic registered internal transfer pilot' for r in data['workflow_runs']):
              raise SystemExit('A prior live launch exists; no automatic retry or resampling')
          PY
      - name: Acquire only the pinned public baseline archive
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 --max-filesize 33554432 \
            https://codeload.github.com/spring-petclinic/spring-petclinic-rest/tar.gz/e1987d2b4715b30f8b97050b3a399fdcadf92cb3 \
            --output "$RUNNER_TEMP/pilot-upstream.tar.gz"
          echo "e3602e1bbfc30f93120ae0bf32c390e1b03e34561fd47d0ae241a85659a1134e  $RUNNER_TEMP/pilot-upstream.tar.gz" | sha256sum --check
      - name: Install SDK in trusted controller only
        run: python -m pip install 'openai>=2,<3'
      - name: Initialize registered pilot and access check (no inference)
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python -m preflight.petclinic_pilot --baseline-archive "$RUNNER_TEMP/pilot-upstream.tar.gz" --output "$RUNNER_TEMP/pilot-evidence" --initialize-only
      - name: pc-001 source_aware_conventional
        run: python -m preflight.petclinic_pilot --baseline-archive "$RUNNER_TEMP/pilot-upstream.tar.gz" --output "$RUNNER_TEMP/pilot-evidence" --case-id pc-001 --method source_aware_conventional
      - name: pc-001 simple_meta
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python -m preflight.petclinic_pilot --baseline-archive "$RUNNER_TEMP/pilot-upstream.tar.gz" --output "$RUNNER_TEMP/pilot-evidence" --case-id pc-001 --method simple_meta
      - name: pc-001 wheel_meta
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python -m preflight.petclinic_pilot --baseline-archive "$RUNNER_TEMP/pilot-upstream.tar.gz" --output "$RUNNER_TEMP/pilot-evidence" --case-id pc-001 --method wheel_meta
      - name: pc-002 source_aware_conventional
        run: python -m preflight.petclinic_pilot --baseline-archive "$RUNNER_TEMP/pilot-upstream.tar.gz" --output "$RUNNER_TEMP/pilot-evidence" --case-id pc-002 --method source_aware_conventional
      - name: pc-002 simple_meta
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python -m preflight.petclinic_pilot --baseline-archive "$RUNNER_TEMP/pilot-upstream.tar.gz" --output "$RUNNER_TEMP/pilot-evidence" --case-id pc-002 --method simple_meta
      - name: pc-002 wheel_meta
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python -m preflight.petclinic_pilot --baseline-archive "$RUNNER_TEMP/pilot-upstream.tar.gz" --output "$RUNNER_TEMP/pilot-evidence" --case-id pc-002 --method wheel_meta
      - name: Preserve every completed and adverse outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: petclinic-internal-transfer-pilot-v2
          path: ${{ runner.temp }}/pilot-evidence/
          if-no-files-found: warn
          retention-days: 30
